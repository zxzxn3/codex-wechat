name: Update activity chart

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-chart
  cancel-in-progress: true

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Render chart
        run: python scripts/churn_chart.py
      - name: Commit changed chart
        run: |
          if git diff --quiet -- assets/code-churn-12h-split.svg; then
            echo "Activity chart is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/code-churn-12h-split.svg
          git commit -m "docs: refresh development activity chart [skip ci]"
          git push
