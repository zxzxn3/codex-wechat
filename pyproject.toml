[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-wechat"
version = "1.1.0"
description = "Use Codex from WeChat private chats"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "zxzxn3" }]
dependencies = [
    "cryptography>=38",
    "websockets>=15,<18",
    "curl-cffi>=0.17,<0.18",
    "qrcode>=7.4,<9",
    "pywin32; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "coverage==7.17.2",
    "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["codex_wechat"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".bootstrap", ".bootstrap-venv", ".state", "logs",
                  "workspace", "releases", "copyright", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023", "B904", "UP041"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [".venv/*", ".bootstrap/*", ".bootstrap-venv/*", ".state/*", "logs/*",
        "workspace/*", "releases/*", "htmlcov/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
precision = 0
