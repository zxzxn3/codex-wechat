[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".state", "logs", "workspace", "copyright", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023", "B904", "UP041"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [".venv/*", ".state/*", "logs/*", "workspace/*", "releases/*", "htmlcov/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
precision = 0
